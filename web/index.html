<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" />
    <title>CertiFlow</title>
    <script>
      // Set the theme and direction before the first paint, so the page does not flash.
      try {
        var m = localStorage.getItem("cf_theme");
        if (m === "dark" || (m !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
        if (localStorage.getItem("cf_lang") === "ar") { document.documentElement.lang = "ar"; document.documentElement.dir = "rtl"; }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
