[project]
name = "certiflow"
version = "0.1.0"
description = "Multi-agent certified translation platform: document model, builder, agents"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "python-docx>=1.1",
  "pypdf>=5.0",
  "pypdfium2>=4.30",
  "reportlab>=4.0",
  "pillow>=10.0",
  "numpy>=1.26",
  "lxml>=5.0",
  "opencv-python-headless>=4.9",
  "anthropic>=2.14",
  "langgraph>=1.2",
  "langgraph-checkpoint-sqlite>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
web = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "celery[redis]>=5.4",
  "psycopg[binary]>=3.2",
  "langgraph-checkpoint-postgres>=3.0",
]

[project.scripts]
certiflow = "certiflow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["certiflow*"]

[tool.setuptools.package-data]
"certiflow.profiles" = ["data/*.json"]
"certiflow.agents" = ["prompts/*.md", "prompts/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
