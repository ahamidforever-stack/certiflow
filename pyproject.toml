[project]
name = "certiflow"
version = "0.1.0"
description = "Multi-agent certified translation platform: document model, builder, agents"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "python-docx>=1.1",
  "pypdf>=5.0",
  "pypdfium2>=4.30",
  "reportlab>=4.0",
  "pillow>=10.0",
  "numpy>=1.26",
  "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
certiflow = "certiflow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["certiflow*"]

[tool.setuptools.package-data]
"certiflow.profiles" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
